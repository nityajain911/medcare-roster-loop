services:
  - type: web
    name: medcare-roster-loop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: demo state lives in process memory and is not shared between workers.
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
